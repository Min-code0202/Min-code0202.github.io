<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Redis Pub/Sub message synchronization</title>
  <desc id="desc">Message synchronization between multiple backend instances using Redis Pub/Sub.</desc>
  <rect width="960" height="420" fill="#f7fbfa"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#177c73"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17443f" flood-opacity=".12"/>
    </filter>
  </defs>

  <g transform="translate(54 64)">
    <rect width="150" height="78" rx="12" fill="#ffffff" stroke="#cfe0dc" filter="url(#shadow)"/>
    <text x="75" y="34" text-anchor="middle" fill="#16302c" font-family="Arial, sans-serif" font-size="18" font-weight="800">User A</text>
    <text x="75" y="58" text-anchor="middle" fill="#6b7774" font-family="Arial, sans-serif" font-size="13">room-42</text>
  </g>
  <g transform="translate(54 278)">
    <rect width="150" height="78" rx="12" fill="#ffffff" stroke="#cfe0dc" filter="url(#shadow)"/>
    <text x="75" y="34" text-anchor="middle" fill="#16302c" font-family="Arial, sans-serif" font-size="18" font-weight="800">User B</text>
    <text x="75" y="58" text-anchor="middle" fill="#6b7774" font-family="Arial, sans-serif" font-size="13">room-42</text>
  </g>

  <g transform="translate(286 48)">
    <rect width="190" height="108" rx="14" fill="#ffffff" stroke="#cfe0dc" filter="url(#shadow)"/>
    <text x="95" y="44" text-anchor="middle" fill="#0d4f49" font-family="Arial, sans-serif" font-size="20" font-weight="800">Backend A</text>
    <text x="95" y="72" text-anchor="middle" fill="#6b7774" font-family="Arial, sans-serif" font-size="14">/topic/room/42</text>
  </g>
  <g transform="translate(286 264)">
    <rect width="190" height="108" rx="14" fill="#ffffff" stroke="#cfe0dc" filter="url(#shadow)"/>
    <text x="95" y="44" text-anchor="middle" fill="#0d4f49" font-family="Arial, sans-serif" font-size="20" font-weight="800">Backend B</text>
    <text x="95" y="72" text-anchor="middle" fill="#6b7774" font-family="Arial, sans-serif" font-size="14">/topic/room/42</text>
  </g>

  <g transform="translate(610 122)">
    <rect width="272" height="176" rx="18" fill="#eaf6f3" stroke="#8fc5bb" filter="url(#shadow)"/>
    <text x="136" y="48" text-anchor="middle" fill="#0d4f49" font-family="Arial, sans-serif" font-size="24" font-weight="800">Redis Pub/Sub</text>
    <text x="136" y="84" text-anchor="middle" fill="#53635f" font-family="Arial, sans-serif" font-size="15">PatternTopic /topic/room/*</text>
    <text x="136" y="114" text-anchor="middle" fill="#53635f" font-family="Arial, sans-serif" font-size="15">Private /internal/private</text>
    <text x="136" y="146" text-anchor="middle" fill="#b86b22" font-family="Arial, sans-serif" font-size="15" font-weight="800">fan-out to every BE</text>
  </g>

  <path d="M204 103 H286" stroke="#177c73" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M204 317 H286" stroke="#177c73" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M476 102 C535 102 548 176 610 176" stroke="#177c73" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 244 C548 244 535 318 476 318" stroke="#177c73" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 176 C548 176 535 102 476 102" stroke="#b86b22" stroke-width="4" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
  <path d="M476 318 C535 318 548 244 610 244" stroke="#b86b22" stroke-width="4" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
</svg>
