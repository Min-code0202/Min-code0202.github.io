<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">STOMP channel backpressure fix</title>
  <desc id="desc">Before and after structure for reducing DISCONNECT delay under STOMP channel backpressure.</desc>
  <rect width="960" height="420" fill="#f7fbfa"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#177c73"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17443f" flood-opacity=".12"/>
    </filter>
  </defs>

  <g transform="translate(54 58)">
    <rect width="270" height="304" rx="18" fill="#ffffff" stroke="#cfe0dc" filter="url(#shadow)"/>
    <text x="32" y="46" fill="#16302c" font-family="Arial, sans-serif" font-size="24" font-weight="800">Before</text>
    <text x="32" y="78" fill="#53635f" font-family="Arial, sans-serif" font-size="15">default STOMP channel</text>
    <g transform="translate(32 118)">
      <rect width="206" height="36" rx="8" fill="#f7e6dc"/>
      <text x="103" y="24" text-anchor="middle" fill="#b84d2b" font-family="Arial, sans-serif" font-size="14" font-weight="800">GAME message</text>
    </g>
    <g transform="translate(32 170)">
      <rect width="206" height="36" rx="8" fill="#f7e6dc"/>
      <text x="103" y="24" text-anchor="middle" fill="#b84d2b" font-family="Arial, sans-serif" font-size="14" font-weight="800">RANK broadcast</text>
    </g>
    <g transform="translate(32 222)">
      <rect width="206" height="36" rx="8" fill="#f7e6dc"/>
      <text x="103" y="24" text-anchor="middle" fill="#b84d2b" font-family="Arial, sans-serif" font-size="14" font-weight="800">DISCONNECT delay</text>
    </g>
  </g>

  <path d="M360 210 H458" stroke="#177c73" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <text x="409" y="188" text-anchor="middle" fill="#0d4f49" font-family="Arial, sans-serif" font-size="17" font-weight="800">tuning</text>

  <g transform="translate(494 58)">
    <rect width="412" height="304" rx="18" fill="#ffffff" stroke="#cfe0dc" filter="url(#shadow)"/>
    <text x="32" y="46" fill="#0d4f49" font-family="Arial, sans-serif" font-size="24" font-weight="800">After</text>
    <g transform="translate(32 88)">
      <rect width="162" height="72" rx="12" fill="#eaf6f3" stroke="#8fc5bb"/>
      <text x="81" y="30" text-anchor="middle" fill="#0d4f49" font-family="Arial, sans-serif" font-size="15" font-weight="800">STOMP Channel</text>
      <text x="81" y="52" text-anchor="middle" fill="#53635f" font-family="Arial, sans-serif" font-size="13">core 16 / max 64</text>
    </g>
    <g transform="translate(218 88)">
      <rect width="162" height="72" rx="12" fill="#eaf6f3" stroke="#8fc5bb"/>
      <text x="81" y="30" text-anchor="middle" fill="#0d4f49" font-family="Arial, sans-serif" font-size="15" font-weight="800">Queue Capacity</text>
      <text x="81" y="52" text-anchor="middle" fill="#53635f" font-family="Arial, sans-serif" font-size="13">20,000</text>
    </g>
    <g transform="translate(32 192)">
      <rect width="162" height="72" rx="12" fill="#fff8ec" stroke="#edc783"/>
      <text x="81" y="30" text-anchor="middle" fill="#b86b22" font-family="Arial, sans-serif" font-size="15" font-weight="800">Transport Hook</text>
      <text x="81" y="52" text-anchor="middle" fill="#53635f" font-family="Arial, sans-serif" font-size="13">connect / close</text>
    </g>
    <g transform="translate(218 192)">
      <rect width="162" height="72" rx="12" fill="#fff8ec" stroke="#edc783"/>
      <text x="81" y="30" text-anchor="middle" fill="#b86b22" font-family="Arial, sans-serif" font-size="15" font-weight="800">Heartbeat</text>
      <text x="81" y="52" text-anchor="middle" fill="#53635f" font-family="Arial, sans-serif" font-size="13">10 sec + grace</text>
    </g>
  </g>
</svg>
